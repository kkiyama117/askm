[package]
name = "askm"
version = "0.1.0"
edition = "2021"
description = "Agent skills manager: fetch marketplaces, install plugins, and toggle skills into agent skill directories"
license = "MIT"
repository = "https://github.com/kkiyama117/askm"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
etcetera = "0.11.0"
nucleo-matcher = "0.3.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
